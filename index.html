const $=s=>document.querySelector(s);const app=$('#app');let toastTimer;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}function header(active=''){return `<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">✳</span>folio<em>forge</em></a><nav class="nav"><a href="index.html#templates">Templates</a><a href="index.html#how">How it works</a><a href="templates.html">Explore styles</a><a class="btn btn-lime btn-sm" href="builder.html">Build my portfolio ↗</a></nav></header>`}function footer(){return `<footer class="footer"><a class="brand" href="index.html"><span class="brand-mark">✳</span>folio<em>forge</em></a><span>Built for Bangladesh's independent talent · 2026</span><span>Design boldly. Work globally.</span></footer>`}function reveal(){const els=document.querySelectorAll('.reveal');if(!('IntersectionObserver'in window)){els.forEach(e=>e.classList.add('visible'));return}const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.1});els.forEach(e=>io.observe(e))}function hideLoader(){setTimeout(()=>$('#loadingCover').classList.add('done'),350)}

function templatesPage(){app.innerHTML=header()+`<main class="page-shell"><div class="page-heading"><div><div class="kicker">THE TEMPLATE LIBRARY</div><h1>Find your signature style.</h1><p>Every template is responsive and customizable. Pick the one that fits your profession and make it yours.</p></div><a class="btn btn-lime" href="builder.html">Open builder ↗</a></div><div class="template-page-grid"><article class="template-card"><div class="template-preview preview-dev"><div class="mini-site"><div class="mini-nav"><span>DEV / 001</span><span>CODE · CREATE · SHIP</span></div><div class="mini-head">Built for<br>what's next.</div><div class="mini-lines"></div><div class="mini-lines short"></div><div class="mini-blocks"><i></i><i></i><i></i></div></div></div><div class="template-info"><div class="kicker">FOR WEB DEVELOPERS</div><h3>Dev / Neon Grid</h3><p>A technical, futuristic look with dark surfaces, bright green accents and clean project cards.</p><a class="btn btn-lime btn-sm" href="builder.html?type=developer">Customize this ↗</a></div></article><article class="template-card"><div class="template-preview preview-video"><div class="mini-site"><div class="mini-nav"><span>FRAME / MOTION</span><span>PLAY REEL ↗</span></div><div class="mini-head">Stories<br>in motion.</div><div class="mini-lines"></div><div class="mini-lines short"></div><div class="mini-blocks"><i></i><i></i><i></i></div></div></div><div class="template-info"><div class="kicker">FOR VIDEO EDITORS</div><h3>Frame / Cinema</h3><p>A cinematic, expressive portfolio that puts showreels, video samples and visual storytelling first.</p><a class="btn btn-lime btn-sm" href="builder.html?type=video">Customize this ↗</a></div></article><article class="template-card"><div class="template-preview preview-marketer"><div class="mini-site"><div class="mini-nav"><span>GROWTH STUDIO</span><span>LET'S SCALE ↗</span></div><div class="mini-head">Make noise.<br>Make growth.</div><div class="mini-lines"></div><div class="min const defaultData={type:'developer',name:'Sahadat Hossen',role:'Web Developer & Creative Builder',bio:'I build fast, thoughtful digital experiences that help ambitious brands move forward. Based in Bangladesh, available worldwide.',location:'Barisal, Bangladesh',email:'hello@example.com',phone:'+880 1XXX-XXXXXX',website:'',linkedin:'',facebook:'',github:'',photo:'',slug:'your-name',domain:'',services:['Website Development','UI / UX Implementation','WordPress Websites'],projects:[{title:'Commerce Studio',category:'WEB DEVELOPMENT',url:'https://example.com',image:'',description:'A modern storefront concept.'},{title:'SaaS Launch Page',category:'LANDING PAGE',url:'https://example.com',image:'',description:'A focused product landing page.'},{title:'Personal Brand Site',category:'PORTFOLIO',url:'https://example.com',image:'',description:'A portfolio built to convert.'}]};let data=structuredClone(defaultData);let photoData='';let mobilePreview=false;
function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function safeURL(s){try{let u=new URL(s);return ['http:','https:','mailto:','tel:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}function professionLabel(t){return t==='video'?'Video Editor':t==='marketer'?'Digital Marketer':'Web Developer'}function styleClass(t){return t==='video'?'style-video':t==='marketer'?'style-marketer':''}

function editor(){const q=new URLSearchParams(location.search);try{let saved=localStorage.getItem('folioforge-v2');if(saved){const parsed=JSON.parse(saved);data={...data,...parsed};}}catch{}if(q.get('type')&&['developer','video','marketer'].includes(q.get('type')))data.type=q.get('type');app.innerHTML=header()+`<main class="page-shell"><div class="page-heading"><div><div class="kicker">THE PORTFOLIO STUDIO</div><h1>Make it yours.</h1><p>Fill in the details, choose a signature style and see your portfolio come to life. Your draft is saved in this browser.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-outline btn-sm" id="saveBtn">↧ Save draft</button><button class="btn btn-lime btn-sm" id="exportBtn">Export website ↓</button></div></div><div class="editor-layout"><aside class="editor-panel"><div class="panel-heading"><h2>Portfolio editor</h2><span class="pill">LIVE EDIT</span></div><p class="hint">Your preview updates as you type. Fields are optional unless you want them on your page.</p><div class="form-section" style="border:0;padding-top:0;margin-top:0"><h3>01 / Pick a template</h3><div class="template-picks"><button class="template-pick" data-type="developer">⌘ Developer</button><button class="template-pick" data-type="video">▶ Video editor</button><button class="template-pick" data-type="marketer">↗ Marketer</button></div></div><div class="form-section"><h3>02 / Your profile</h3><label class="field"><span>Full name</span><input id="name" value=""></label><label class="field"><span>Professional title</span><input id="role"></label><label class="field"><span>Short introduction</span><textarea id="bio"></textarea></label><div class="field-grid"><label class="field"><span>Location</span><input id="location"></label><label class="field"><span>Contact email</span><input id="email" type="email"></label></div><div class="field-grid"><label class="field"><span>Phone / WhatsApp</span><input id="phone"></label><label class="field"><span>Profile image</span><input id="photoUpload" type="file" accept="image/*"></label></div><p class="hint">Image stays in this browser draft. Use a small JPG/WebP for best performance.</p></div><div class="form-section"><h3>03 / Social links</h3><label class="field"><span>Portfolio / website URL</span><input id="website" placeholder="https://yourwebsite.com"></label><div class="field-grid"><label class="field"><span>LinkedIn URL</span><input id="linkedin" placeholder="https://linkedin.com/in/..."></label><label class="field"><span>Facebook URL</span><input id="facebook" placeholder="https://facebook.com/..."></label></div><label class="field"><span>GitHub URL (developers)</span><input id="github" placeholder="https://github.com/..."></label></div><div class="form-section"><h3>04 / Services you offer</h3><label class="field"><span>One per line: Service name | image URL (optional)</span><textarea id="services" style="min-height:95px"></textarea></label></div><div class="form-section"><h3>05 / Work samples</h3><p class="hint">Add demo links and optional thumbnail image URLs. Use public links such as Behance, GitHub, YouTube or Google Drive.</p><div id="projectFields"></div><button class="btn btn-outline btn-sm" type="button" id="addProject">＋ Add another project</button></div><div class="form-section"><h3>06 / Domain settings</h3><label class="field"><span>Free subdomain name (draft)</span><input id="slug" placeholder="your-name"></label><label class="field"><span>Custom domain (optional)</span><input id="domain" placeholder="www.yourdomain.com"></label><p class="hint">Domain fields are saved in your draft only. Connecting a real domain requires deployment, DNS and a hosting setup.</p><button class="btn btn-purple" type="button" id="publishBtn" style="width:100%">Check publish settings ↗</button><div class="status" id="publishStatus"></div></div><div class="editor-actions"><button class="btn btn-outline btn-sm" id="resetBtn">Reset demo</button><button class="btn btn-lime btn-sm" id="exportBtn2">Export HTML ↓</button></div></aside><section class="preview-panel"><div class="preview-toolbar"><strong>✳ Live portfolio preview</strong><div class="toolbar-actions"><button class="icon-btn active" id="desktopBtn">▣ Desktop</button><button class="icon-btn" id="mobileBtn">▯ Mobile</button><button class="icon-btn" id="refreshBtn">↻ Refresh</button></div></div><div class="preview-stage"><div class="browser-frame" id="browserFrame"><div class="browser-chrome"><i></i><i></i><i></i><span id="previewAddress">your-name.folioforge.site</span></div><div id="portfolioPreview"></div></div></div></section></div></main>`+footer();fillForm();renderProjectFields();renderPreview();updateTypeButtons();document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{data.type=b.dataset.type;renderPreview();updateTypeButtons();toast('Template changed to '+professionLabel(data.type))});const ids=['name','role','bio','location','email','phone','website','linkedin','facebook','github','slug','domain'];ids.forEach(id=>$('#'+id).addEventListener('input',()=>{data[id]=$('#'+id).value;renderPreview();autosave()}));$('#services').addEventListener('input',()=>{data.services=$('#services').value.split('\n').map(x=>x.trim()).filter(Boolean);renderPreview();autosave()});$('#photoUpload').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('Choose an image file.');if(f.size>2*1024*1024){toast('Please use an image under 2 MB.');e.target.value='';return}const r=new FileReader();r.onload=()=>{photoData=r.result;data.photo=photoData;renderPreview();autosave();toast('Profile image added')};r.readAsDataURL(f)});$('#addProject').onclick=()=>{data.projects.push({title:'New project',category:'SELECTED WORK',url:'https://example.com',image:'',description:''});renderProjectFields();renderPreview();autosave()};$('#saveBtn').onclick=saveDraft;$('#exportBtn').onclick=exportSite;$('#exportBtn2').onclick=exportSite;$('#publishBtn').onclick=()=>{const d=$('#publishStatus');d.textContent=data.domain?`Custom domain saved as “${data.domain}”. This static builder cannot connect DNS or publish it automatically. Export your site, deploy it to Vercel, then add the domain in Vercel and update DNS records.`:`Draft address: ${data.slug||'your-name'}.folioforge.site. This is a label only, not a live subdomain. Export the site and deploy it to hosting to get a public URL.`;d.classList.add('show')};$('#desktopBtn').onclick=()=>{mobilePreview=false;$('#browserFrame').style.maxWidth='1050px';$('#desktopBtn').classList.add('active');$('#mobileBtn').classList.remove('active')};$('#mobileBtn').onclick=()=>{mobilePreview=true;$('#browserFrame').style.maxWidth='390px';$('#mobileBtn').classList.add('active');$('#desktopBtn').classList.remove('active')};$('#refreshBtn').onclick=()=>{renderPreview();toast('Preview refreshed')};$('#resetBtn').onclick=()=>{if(!confirm('Reset your editor to the example portfolio?'))return;data=structuredClone(defaultData);photoData='';fillForm();renderProjectFields();renderPreview();updateTypeButtons();autosave();toast('Example restored')}}

ioHTML(data);const addr=$('#previewAddress');if(addr)addr.textContent=(data.domain||((data.slug||'your-name')+'.folioforge.site')).replace(/^https?:\/\//,'');}function autosave(){try{localStorage.setItem('folioforge-v2',JSON.stringify({...data,photo:photoData||data.photo||''}))}catch(e){/* localStorage quota can be exceeded by large images */}}function saveDraft(){try{localStorage.setItem('folioforge-v2',JSON.stringify({...data,photo:photoData||data.photo||''}));toast('Draft saved in this browser')}catch(e){toast('Draft could not be saved. Try a smaller profile image.')}}function exportSite(){const d={...data,photo:photoData||data.photo||''};const html=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="${escapeHTML(d.bio)}"><title>${escapeHTML(d.name||'Portfolio')} — ${escapeHTML(d.role||professionLabel(d.type))}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;font-family:Manrope,sans-serif}.portfolio-frame{color:#17151d;background:#f4f0e8;min-height:100vh}.pf-nav{padding:22px 7%;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800}.pf-brand{font:700 17px 'Space Grotesk'}.pf-nav-links{display:flex;gap:16px;color:#666;font-size:10px}.pf-hero{padding:55px 7% 45px;display:grid;grid-template-columns:1.1fr .8fr;gap:25px;align-items:center;min-height:310px}.pf-kicker{font:10px 'DM Mono';text-transform:uppercase;letter-spacing:1px;color:#5e4cb4}.pf-hero h2{font:700 clamp(32px,4vw,57px)/.98 'Space Grotesk';letter-spacing:-2px;margin:15px 0}.pf-hero p{color:#65616d;font-size:12px;line-height:1.8;max-width:420px}.pf-button{display:inline-flex;margin-top:12px;padding:11px 15px;border-radius:6px;background:#1
